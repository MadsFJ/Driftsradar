name: diag puzzel
on:
  push:
    branches: [diag-puzzel]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA='Driftsradar/1.0 (+https://github.com/MadsFJ/Driftsradar)'
          for u in https://api.status.io/1.0/status/58207f2bf02471510e000303 https://status.puzzel.com/pages/58207f2bf02471510e000303/rss; do
            echo "=================== $u"
            curl -sS -A "$UA" -H 'Origin: https://madsfj.github.io' -D - -o body.txt --max-time 20 "$u" | grep -iE '^(HTTP|content-type|location|access-control)' || true
            echo "--- body:"; head -c 6000 body.txt; echo
          done
